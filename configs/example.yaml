dataset_path: "./dataset"
data_name: "assistments12" 

checkpoint_dir: .ckpts
seed: 12405
bias: False
test_name: 'low'
 

 
emotion_dkvmn_config:
  dim_s: 64               
  size_m: 20            
  dropout: 0.05         
  emo_hidden: 32         
  num_emotions: 4         
  behavior_proj_dim: 64 

 
train_config:
  wl: 0.0
  log_wandb_fold: True
  sequence_option: "recent" # or "early"
  seq_len: 100
  batch_size: 64         
  eval_batch_size: 64      
  num_epochs: 200
  print_epochs: 1
  max_grad_norm: 2.0
  learning_rate: 0.0001    
  optimizer: adam
  
  loss: BCE

  ## Model Save
  save_model: False
  save_epochs: 1
  save_model_name: "tmp"
  log_path: "logs"
 